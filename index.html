<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFC WORLDWIDE - النسخة العالمية للتوقعات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0e17;
            --card-bg: #121824;
            --accent-gold: #f39c12;
            --accent-blue: #00d2ff;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --text-main: #ffffff;
            --border-color: #2d3748;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; }

        header {
            background: rgba(18, 24, 36, 0.95); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 1000; border-bottom: 2px solid #1a2332;
        }

        .nav-container {
            max-width: 1200px; margin: 0 auto; display: flex;
            justify-content: space-between; align-items: center; padding: 15px 20px;
        }

        .logo {
            font-size: 22px; font-weight: 900;
            background: linear-gradient(45deg, var(--accent-gold), var(--accent-blue));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .hero {
            text-align: center; padding: 40px 20px 20px;
            background: linear-gradient(rgba(10, 14, 23, 0.85), rgba(10, 14, 23, 0.95)),
                        url('https://images.unsplash.com/photo-1549719386-74dfcbf7dbed?auto=format&fit=crop&w=1350&q=80') center/cover;
            border-bottom: 1px solid var(--border-color);
        }

        .container { max-width: 1100px; margin: 0 auto; padding: 30px 20px; }

        .section-title {
            text-align: center; font-size: 1.6rem; margin: 30px 0 20px;
            color: var(--accent-gold); display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        /* Points Tracker */
        .points-box {
            background: linear-gradient(135deg, #182030, #121824);
            border: 2px solid var(--accent-gold); border-radius: 12px;
            padding: 20px; text-align: center; margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(243, 156, 18, 0.15);
        }
        .points-val { font-size: 3rem; font-weight: 900; color: var(--accent-gold); }

        /* Fight Cards */
        .fights-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .fight-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 20px; text-align: center;
        }
        .fight-title { color: var(--accent-blue); font-size: 0.9rem; font-weight: bold; margin-bottom: 12px; }

        .prediction-buttons { display: flex; gap: 10px; margin-top: 15px; justify-content: center; }
        .predict-btn {
            flex: 1; padding: 10px; border: 1px solid var(--border-color);
            background: #182030; color: #fff; border-radius: 8px; cursor: pointer;
            font-weight: bold; transition: all 0.2s;
        }
        .predict-btn.selected { background: var(--accent-gold); color: #000; border-color: var(--accent-gold); }

        /* Table */
        .table-responsive { overflow-x: auto; margin-top: 15px; border-radius: 12px; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; text-align: center; background: var(--card-bg); }
        th, td { padding: 14px 10px; border-bottom: 1px solid var(--border-color); }
        th { background: #182030; color: var(--accent-gold); }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo"><i class="fa-solid fa-globe"></i> SFC WORLDWIDE - النسخة العالمية</div>
        </div>
    </header>

    <section class="hero">
        <h1>توقعات الجمهور العالمية</h1>
        <p>توقع الفائز في النزالات واكسب <strong>3 نقاط</strong> عن كل توقع صحيح!</p>
    </section>

    <div class="container">

        <!-- رصيد النقاط -->
        <div class="points-box">
            <h3>رصيد نقاط التوقع الخاص بك</h3>
            <div class="points-val" id="myPoints">0</div>
            <p><i class="fa-solid fa-star" style="color:var(--accent-gold);"></i> كل توقع صحيح يمنحك +3 نقاط</p>
        </div>

        <!-- مباريات التوقع -->
        <h2 class="section-title"><i class="fa-solid fa-fire"></i> نزالات البطولة المتاحة للتوقع</h2>
        <div class="fights-grid" id="fightsContainer"></div>

        <!-- جدول سجل جميع المقاتلين المحدث حسب الصورة -->
        <h2 class="section-title"><i class="fa-solid fa-trophy"></i> السجل الشامل لجميع المقاتلين (SFC Leaderboard)</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>اسم المقاتل</th>
                        <th>لعب</th>
                        <th>فاز</th>
                        <th>تعادل</th>
                        <th>خسر</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody"></tbody>
            </table>
        </div>

    </div>

    <script>
        // قائمة المقاتلين المحدثة
        let fighters = [
            { name: 'طه (البطل)', wins: 9, draws: 0, losses: 0 },
            { name: 'فارس', wins: 6, draws: 0, losses: 2 },
            { name: 'فادي', wins: 4, draws: 0, losses: 3 },
            { name: 'محمد', wins: 4, draws: 0, losses: 4 },
            { name: 'ياسين', wins: 2, draws: 0, losses: 1 },
            { name: 'عبد المؤمن', wins: 1, draws: 0, losses: 3 },
            { name: 'فاروق', wins: 1, draws: 0, losses: 6 },
            { name: 'عبد الرؤوف', wins: 0, draws: 0, losses: 1 },
            { name: 'فراس', wins: 0, draws: 0, losses: 1 },
            { name: 'عبد الرحمن', wins: 0, draws: 0, losses: 0 },
            { name: 'أحمد', wins: 0, draws: 0, losses: 0 }
        ];

        // قائمة النزالات للتوقع
        let fights = [
            { id: 101, group: 'GOLD GROUP - نزال اللقب', f1: 'طه (البطل)', f2: 'فارس' },
            { id: 102, group: 'GOLD GROUP - القمة', f1: 'فادي', f2: 'محمد' },
            { id: 103, group: 'HEAVYWEIGHT - الوزن الثقيل', f1: 'عبد الرحمن', f2: 'أحمد' },
            { id: 104, group: 'MATCHDAY - مواجهة نارية', f1: 'عبد الرؤوف', f2: 'فراس' },
            { id: 105, group: 'CHALLENGE - مواجهة التحدي', f1: 'فارس', f2: 'ياسين' }
        ];

        let userPoints = parseInt(localStorage.getItem('sfc_world_user_pts')) || 0;
        document.getElementById('myPoints').innerText = userPoints;

        function renderWorldVersion() {
            renderFights();
            renderLeaderboard();
        }

        function renderFights() {
            const container = document.getElementById('fightsContainer');
            container.innerHTML = '';

            fights.forEach(fight => {
                let currentPred = localStorage.getItem('sfc_world_predict_' + fight.id);
                let p1Selected = currentPred === fight.f1 ? 'selected' : '';
                let p2Selected = currentPred === fight.f2 ? 'selected' : '';

                container.innerHTML += `
                    <div class="fight-card">
                        <div class="fight-title">${fight.group}</div>
                        <p><strong>${fight.f1}</strong> VS <strong>${fight.f2}</strong></p>
                        <div class="prediction-buttons">
                            <button class="predict-btn ${p1Selected}" onclick="makePrediction(${fight.id}, '${fight.f1}')">${fight.f1}</button>
                            <button class="predict-btn ${p2Selected}" onclick="makePrediction(${fight.id}, '${fight.f2}')">${fight.f2}</button>
                        </div>
                    </div>
                `;
            });
        }

        function renderLeaderboard() {
            const body = document.getElementById('leaderboardBody');
            body.innerHTML = '';
            fighters.forEach((f, idx) => {
                let played = f.wins + f.draws + f.losses; // حساب إجمالي النزالات تلقائياً
                body.innerHTML += `
                    <tr>
                        <td>${idx + 1}</td>
                        <td><strong>${f.name}</strong></td>
                        <td><span style="color:var(--accent-blue); font-weight:bold;">${played}</span></td>
                        <td><span style="color:var(--accent-green); font-weight:bold;">${f.wins}</span></td>
                        <td><span style="color:var(--accent-gold); font-weight:bold;">${f.draws}</span></td>
                        <td><span style="color:var(--accent-red); font-weight:bold;">${f.losses}</span></td>
                    </tr>
                `;
            });
        }

        function makePrediction(fightId, fighter) {
            localStorage.setItem('sfc_world_predict_' + fightId, fighter);
            alert(`تم تسجيل توقعك لفوز المقاتل (${fighter})! عند تحقيق التوقع ستحصل على +3 نقاط.`);
            renderFights();
        }

        renderWorldVersion();
    </script>
</body>
</html>
